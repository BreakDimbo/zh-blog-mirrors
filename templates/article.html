<!DOCTYPE html>
<html lang="zh-CN">
<head>
{{HEAD}}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{UP}}assets/article.css"><script defer src="{{UP}}assets/article.js"></script>
{{LEGACY_CSS}}
</head>
<body class="za">
<!-- za:article v1 -->
<div class="za-page">
<header class="za-head">
<p class="za-kicker" data-za-gen><span>{{TYPE}}</span>{{DATE}}</p>
<h1 class="za-title">{{TITLE}}</h1>
{{SUBTITLE}}
{{META}}
<!-- za:origin --><div class="za-origin">{{ORIGIN}}</div><!-- /za:origin -->
</header>
<div class="za-layout"><aside class="za-toc" data-za-gen hidden></aside>
<!-- za:content --><main class="za-content">{{CONTENT}}</main><!-- /za:content -->
</div>
<footer class="za-foot">
<!-- za:foot --><div class="za-foot-orig">{{FOOTER}}</div><!-- /za:foot -->
<div class="za-foot-std" data-za-gen>
<p>非官方中文镜像 / 翻译 / 评述，仅供阅读学习；原文与配图版权归原作者及权利人所有。{{SOURCE_LINK}}如需删除，请 <a href="https://github.com/BreakDimbo/zh-blog-mirrors/issues/new?title=Removal%20request">提交移除请求</a>。</p>
<p><span class="mark">zh-blog-mirrors</span> · <a href="{{UP}}">返回文库首页</a> · <a href="https://github.com/BreakDimbo/zh-blog-mirrors">GitHub</a></p>
</div>
</footer>
</div>
</body>
</html>
